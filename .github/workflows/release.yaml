# Interim release automation (SR-2): triggered by the GitHub Release that
# release-please.yaml publishes. Builds a version-stamped .hpi and attaches it
# to the release. Retired at jenkinsci hosting (JEP-229).
name: Release

on:
  release:
    types: [published]

# Least-privilege default: the build job only needs read (checkout +
# upload-artifact). The publish job overrides to contents: write for the
# gh release upload.
permissions:
  contents: read

jobs:
  build:
    runs-on: varroa-mcp-tools-runner
    timeout-minutes: 30
    container:
      image: maven:3.9-eclipse-temurin-21
      volumes:
        - varroa-m2-cache:/root/.m2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Stamp version and package
        run: |
          set -euo pipefail
          TAG='${{ github.event.release.tag_name }}'
          # Version is tag-derived and stamped only for this build; never
          # committed back (pom stays 1.0-SNAPSHOT in git).
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
          mvn -B -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: hpi
          path: target/varroa-mcp-tools.hpi
          if-no-files-found: error

  publish:
    needs: build
    runs-on: varroa-mcp-tools-runner
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No container: gh is absent from the maven image; it and GITHUB_TOKEN are
      # available on the host runner.
      - uses: actions/download-artifact@v7
        with:
          name: hpi
      - name: Upload hpi to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" varroa-mcp-tools.hpi --clobber
