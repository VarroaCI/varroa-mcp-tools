# Interim release automation (SR-2): publishes the plugin .hpi on GitHub
# Releases until the plugin is hosted under the jenkinsci org, at which point
# JEP-229 continuous delivery replaces this entire mechanism. Kept
# self-contained for one-PR removal.
#
# Build+publish is gated on the action's release_created output and runs in this
# same workflow: a release created by GITHUB_TOKEN does not fire a separate
# `on: release: published` workflow (GitHub suppresses token-triggered events to
# prevent recursion), so the publish must be part of this run.
name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'

# Least-privilege default; jobs widen as needed.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # release-type is read from release-please-config.json, not passed inline.
      - id: rp
        uses: google-github-actions/release-please-action@v4

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # Ephemeral runners drop the named docker volume this job used to mount.
      - uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: m2-release-${{ hashFiles('pom.xml') }}
          restore-keys: |
            m2-release-
      - name: Stamp version and package
        # Container run steps default to `sh`, which rejects `set -o pipefail`;
        # the maven image ships bash, so run this step under it.
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ needs.release-please.outputs.tag_name }}'
          # Version is tag-derived and stamped only for this build; never
          # committed back (pom stays 1.0-SNAPSHOT in git).
          mvn -B versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
          mvn -B -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: hpi
          path: target/varroa-mcp-tools.hpi
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: hpi
      # Upload via the GitHub API (github-script's pre-authenticated octokit)
      # rather than the gh CLI, so this step does not depend on what the runner
      # image ships. Clobbers any existing same-named asset for idempotent
      # re-runs.
      - name: Attach hpi to the release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const name = 'varroa-mcp-tools.hpi';
            const tag = '${{ needs.release-please.outputs.tag_name }}';
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            for (const asset of release.assets) {
              if (asset.name === name) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }
            const data = fs.readFileSync(name);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name,
              data,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': data.length,
              },
            });
